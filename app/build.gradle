plugins { id 'com.android.application' }

android {
    namespace 'com.tenetcaros.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tenetcaros.app'
        minSdk 31
        targetSdk 35
        versionCode 10000
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
